{% load static %} %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="{% static 'loops/style.css' %}" />
</head>
<body>
  
<div class="grid">
  {% for slot in slots %}
    <div class="card{% if slot.bus_number %} occupied{% endif %}" data-slot-id="{{ slot.id }}">
      <div class="slot-num">Slot {{ slot.slot_number }}</div>
      <div class="bus-num">
        {% if slot.bus_number %}Bus #{{ slot.bus_number }}{% else %}<span class="empty">Empty</span>{% endif %}
      </div>
    </div>
  {% endfor %}
</div>
</body>

<script>
  const DATA_URL = "{% url 'loops:loop_data' loop %}";

  async function refresh() {
    try {
      const res = await fetch(DATA_URL);
      if (!res.ok) return;
      const { slots } = await res.json();
      for (const s of slots) {
        const card = document.querySelector(`[data-slot-id="${s.id}"]`);
        if (!card) continue;
        card.classList.toggle("occupied", !!s.bus_number);
        const num = card.querySelector(".bus-num");
        if (s.bus_number) {
          num.textContent = `Bus #${s.bus_number}`;
        } else {
          num.innerHTML = '<span class="empty">Empty</span>';
        }
      }
    } catch (e) { /* network blip; try again next tick */ }
  }

  setInterval(refresh, 5000);
</script>
</html>
